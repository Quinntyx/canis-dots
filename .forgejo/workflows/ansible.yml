name: Ansible
"on":
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install isolated test dependencies
        run: |
          apt-get update
          apt-get install -y python3-venv tmux nodejs
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Verify source and disposable homes only
        run: PATH="$PWD/.venv/bin:$PATH" ./scripts/check all

  deploy:
    if: ${{ forgejo.ref == 'refs/heads/main' && forgejo.event_name != 'pull_request' }}
    needs: check
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:act-24.04
    # Do not cancel an in-progress deployment halfway through a host.
    concurrency:
      group: dots-production
      cancel-in-progress: false
    steps:
      - uses: https://data.forgejo.org/actions/checkout@v4
      - name: Install controller dependencies inside the job container
        run: |
          apt-get update
          apt-get install -y python3-venv openssh-client
          python3 -m venv .venv
          .venv/bin/pip install -r requirements-dev.txt
      - name: Deploy the merged configuration to the explicit inventory
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_SSH_PRIVATE_KEY: ${{ secrets.ANSIBLE_SSH_PRIVATE_KEY }}
          ANSIBLE_KNOWN_HOSTS: ${{ secrets.ANSIBLE_KNOWN_HOSTS }}
          ANSIBLE_SSH_USER: ${{ secrets.ANSIBLE_SSH_USER }}
          ANSIBLE_BECOME_PASSWORD: ${{ secrets.ANSIBLE_BECOME_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          : "${ANSIBLE_VAULT_PASSWORD:?Set the repository Vault password secret}"
          : "${ANSIBLE_SSH_PRIVATE_KEY:?Set the repository deployment SSH key secret}"
          : "${ANSIBLE_KNOWN_HOSTS:?Set verified host public keys, not runtime ssh-keyscan output}"
          : "${ANSIBLE_SSH_USER:?Set the normal deployment account}"
          : "${ANSIBLE_BECOME_PASSWORD:?Set its sudo password}"
          export PATH="$PWD/.venv/bin:$PATH"
          export ANSIBLE_CONFIG="$PWD/ansible.cfg"
          umask 077
          private=$(mktemp -d)
          trap 'ansible localhost -c local -i localhost, -m ansible.builtin.file -a "path=$private state=absent" >/dev/null' EXIT
          printf '%s\n' "$ANSIBLE_VAULT_PASSWORD" > "$private/vault-password"
          printf '%s\n' "$ANSIBLE_SSH_PRIVATE_KEY" > "$private/id"
          printf '%s\n' "$ANSIBLE_KNOWN_HOSTS" > "$private/known_hosts"
          export ANSIBLE_VAULT_PASSWORD_FILE="$private/vault-password"
          export ANSIBLE_PRIVATE_KEY_FILE="$private/id"
          export ANSIBLE_SSH_COMMON_ARGS="-o UserKnownHostsFile=$private/known_hosts -o StrictHostKeyChecking=yes"
          ansible-playbook playbooks/site.yml --limit workstations \
            --extra-vars @playbooks/ci-vars.yml
