# SwarmUI Generate tab over the existing ComfyUI GPU engine.
#
# browser → gate (always on, :8188 on loopback + tailnet)
#         → 127.0.0.1:18189 (systemd socket; wakes both containers)
#         → 127.0.0.1:17801 (SwarmUI) → comfyui:8188 (GPU backend)
#
# Kept at this path to reuse the models, images, and existing systemd/socket setup.
# Normal use: open http://araveia:8188/ (or the tailnet IP). Do not `up` by hand.
#   systemctl --user stop comfyui         # stop both containers / free VRAM now
#   journalctl --user -u comfyui -f        # frontend + GPU backend logs
# The gate is started once with `docker compose up -d gate`; it stays running.
services:
  comfyui:
    build: .
    image: local/comfyui:v0.45.0-swarm-f86858df
    container_name: comfyui
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    user: "1000:1000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - ./models:/opt/ComfyUI/models
      - ./input:/opt/ComfyUI/input
      - ./output:/opt/ComfyUI/output
      - ./user:/opt/ComfyUI/user
      - ./custom_nodes:/opt/ComfyUI/custom_nodes
    ports:
      - "127.0.0.1:18188:8188"  # backend diagnostics; not exposed on the tailnet

  swarmui:
    build: ./swarm
    image: local/swarmui:f86858df
    container_name: swarmui
    restart: "no"
    stop_grace_period: 20s
    user: "1000:1000"
    depends_on:
      - comfyui
    volumes:
      # Swarm creates model subdirectories and maintains its model catalogue.
      - ./models:/models
      - ./output:/output
      - ./swarm/data:/SwarmUI/Data
      - ./swarm/Settings.fds:/etc/swarm/Settings.fds:ro
      - ./swarm/Backends.fds:/etc/swarm/Backends.fds:ro
    ports:
      - "127.0.0.1:17801:7801"  # only the systemd socket proxy talks to this

  gate:
    image: caddy:2-alpine
    container_name: comfyui-gate
    restart: always
    network_mode: host
    user: "1000:1000"
    read_only: true
    tmpfs:
      - /tmp
    environment:
      - XDG_CONFIG_HOME=/tmp
      - XDG_DATA_HOME=/tmp
    volumes:
      - ./gate/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./gate/loading.html:/srv/loading.html:ro
