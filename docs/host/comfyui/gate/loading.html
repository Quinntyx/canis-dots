<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwarmUI · starting</title>
<style>
  :root { color-scheme: light dark; --fg: #1d1d1f; --muted: #6e6e73; --bg: #f5f5f7; --accent: #4f7cff; --warn: #c27c0e; --bad: #d14343; }
  @media (prefers-color-scheme: dark) { :root { --fg: #f2f2f2; --muted: #9a9aa0; --bg: #141416; --accent: #7c9cff; --warn: #e0a23a; --bad: #ff6b6b; } }
  html, body { height: 100%; margin: 0; }
  body { display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { text-align: center; max-width: 30rem; padding: 2rem; }
  .spinner { width: 44px; height: 44px; margin: 0 auto 1.5rem; border-radius: 50%;
             border: 4px solid color-mix(in srgb, var(--accent) 20%, transparent);
             border-top-color: var(--accent); animation: spin .9s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 .25rem; }
  p { margin: .25rem 0; color: var(--muted); }
  code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; }
  .elapsed { font-variant-numeric: tabular-nums; }
  body.warn .spinner { border-top-color: var(--warn); }
  body.down .spinner, body.offline .spinner { animation: none; border-color: var(--bad); }
</style>
</head>
<body>
<main>
  <div class="spinner" aria-hidden="true"></div>
  <h1 id="title">Starting SwarmUI…</h1>
  <p id="detail">araveia is reachable; SwarmUI and its image engine are booting. This page reloads when they are ready.</p>
  <p class="elapsed" id="elapsed">0 s</p>
</main>
<script>
  const started = Date.now();
  const $ = (id) => document.getElementById(id);
  const states = {
    starting: ["Starting SwarmUI…", "araveia is reachable; SwarmUI and its image engine are booting. This page reloads when they are ready."],
    warn: ["Still starting…", "This is taking longer than usual. Check <code>systemctl --user status comfyui</code> and <code>journalctl --user -u comfyui</code> on araveia."],
    down: ["SwarmUI is not starting", "araveia answered, but the on-demand chain failed. Check <code>systemctl --user status comfyui-proxy.socket comfyui</code>. Retrying…"],
    offline: ["Can't reach araveia", "The gate stopped answering: Tailscale, the network, or the host is down. Retrying…"],
  };
  function show(name) {
    document.body.className = name;
    $("title").textContent = states[name][0];
    $("detail").innerHTML = states[name][1];
  }
  async function poll() {
    const secs = Math.round((Date.now() - started) / 1000);
    $("elapsed").textContent = secs + " s";
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 8000);
    try {
      const r = await fetch("/__comfy_gate", { cache: "no-store", signal: ctl.signal });
      if (r.ok) { location.reload(); return; }
      show(r.headers.get("X-Comfy-Gate") === "down" ? "down" : secs > 120 ? "warn" : "starting");
    } catch {
      show("offline");
    } finally {
      clearTimeout(timer);
    }
    setTimeout(poll, 2000);
  }
  setInterval(() => { $("elapsed").textContent = Math.round((Date.now() - started) / 1000) + " s"; }, 1000);
  poll();
</script>
</body>
</html>
