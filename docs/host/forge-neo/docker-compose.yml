# Separate from SwarmUI; the existing private Caddy gate serves /forge/.
# browser :8188/forge/ -> systemd socket :18190 -> Forge Neo :17860.
# Start through the socket, not `docker compose up`, to retain idle shutdown.
services:
  forge-neo:
    build: .
    image: local/forge-neo:507e66fb
    container_name: forge-neo
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    shm_size: 1gb
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      # Share the existing weights read-only: no duplicates and no automatic replacements.
      - type: bind
        source: ../comfyui/models
        target: /models
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./data
        target: /data
        bind:
          create_host_path: false
      - type: bind
        source: ./output
        target: /output
        bind:
          create_host_path: false
      - ./config.initial.json:/etc/forge/config.initial.json:ro
    ports:
      - "127.0.0.1:17860:7860"
