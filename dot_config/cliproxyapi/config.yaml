# Tailnet-only inference has no API key. The private management key is injected
# into an untracked runtime copy by cliproxyapi.
config-version: 8
server:
  host: "100.110.255.43"
  port: 8317
  discovery:
    enabled: false
oauth:
  auth-dir: "~/.local/share/cliproxyapi/auths"
routing:
  strategy: "reset-pressure"
  session-affinity: true
  session-affinity-ttl: "168h"
  session-affinity-subagents: false
  burn-deadline:
    enabled: true
    threshold: 0.75
    poll-interval: "1m"
    max-observation-age: "2m"
    state-file: "~/.local/state/cliproxyapi/burn.json"
observability:
  usage:
    usage-statistics-enabled: true
upstream:
  claude:
    # Pass every client's real request shape through (e.g. the t3-code entrypoint
    # User-Agent) instead of cloaking non-native clients as claude-cli/2.1.280.
    disable-claude-cloak-mode: true
    # List real model IDs to Anthropic-style clients instead of claude-fable-5-dd-<reversed>
    # aliases. Claude Code's gateway discovery then keeps only Claude models; non-Claude hub
    # models reach its picker through modelPicker.options in ~/.claude/settings.json.
    disable-cloaking-model-list: true

# Native Codex and Claude accounts keep their existing routing above. Upstream
# API credentials and model declarations live in the server-private providers.yaml.
model-routes:
  - alias: "GLM-5.3"
    targets:
      - provider: "opencode-go"
        model: "glm-5.3"
      - provider: "openrouter"
        model: "z-ai/glm-5.3"
  - alias: "tidepool-alpha"
    targets:
      - provider: "openrouter"
        model: "openrouter/tidepool-alpha-free"
  - alias: "deepseek-v4.1-flash-1017"
    targets:
      - provider: "opencode-go"
        model: "deepseek-v4.1-flash"
      - provider: "mistral"
        model: "deepseek-v4-1-flash-1017"
      - provider: "openrouter"
        model: "deepseek/deepseek-v4.1-flash-1017"
        params:
          provider:
            only: ["wafer", "relace"]
            order: ["wafer", "relace"]
            allow_fallbacks: true
  - alias: "deepseek-v4.1-flash-1017:fast"
    targets:
      - provider: "inco"
        model: "deepseek-v4.1-flash:fast"
  - alias: "muse-ember"
    targets:
      - provider: "openrouter"
        model: "meta/muse-ember"
        params:
          provider:
            only: ["meta"]
            order: ["meta"]
            allow_fallbacks: false
