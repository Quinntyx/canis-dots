# Kitty configuration

# Font
font_family      Fira Code
font_features    FiraCode-Regular +onum
font_features    FiraCode-Retina +onum
font_features    FiraCode-Medium +onum
font_features    FiraCode-Bold +onum
font_features    FiraCode-Italic +onum

bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Light blue-gray theme (near white)
background       #fffff0
foreground       #2b3440
selection_background #c9d7e5
selection_foreground #1f2933

# Cursor
cursor           #4a6fa5
cursor_text_color background

# Opacity
background_opacity 0.90
dynamic_background_opacity no

# Disable window decorations
hide_window_decorations yes

# Optional: smoother appearance
confirm_os_window_close 0
enable_audio_bell no
allow_remote_control yes
shell_integration enabled
shell fish

# ==========================================
# Padding & Margins (Based on 18px Niri gaps)
# ==========================================
# 50% of Niri gaps = 9px
window_padding_width 9

# ==========================================
# Tab Bar Configuration
# ==========================================
tab_bar_edge bottom

# Force the tab bar to always be visible (even with only 1 tab)
tab_bar_min_tabs 1

# Hide the standard tab bar background so the gaps appear fully transparent
tab_bar_background none

# Equalize padding around the tab bar (Left/Right margins: 9px)
tab_bar_margin_width 9

# Top/Bottom margins for the tab bar.
# First value (11) = Gap between the tab bar and the OS window edge (bottom).
# Second value (0) = Gap between the terminal content and the tab bar (top).
tab_bar_margin_height 11 0

# Set style to separator, but make the actual separator empty. 
# We will handle the spacing and gaps in the template below!
tab_bar_style separator
tab_separator ""

# The Magic Template: 
# 1. Colors the background to the tab color.
# 2. Adds 3 generous spaces of padding before and after the title.
# 3. Resets the background to default (transparent) and adds 2 spaces for the gap!
tab_title_template "{fmt.fg.tab}{fmt.bg.tab}   {title}   {fmt.fg.default}{fmt.bg.default}  "
active_tab_title_template none

# Active Tab: Bright white background with dark text for contrast
active_tab_foreground   #2b3440
active_tab_background   #ffffff
active_tab_font_style   bold

# Inactive Tab: Dimmed text with a subdued/dimmed background block
inactive_tab_foreground #8b9eb5
inactive_tab_background #e6ecf2
inactive_tab_font_style normal

# ==========================================
# Basic Palette
# ==========================================
color0  #f4f7fb
color1  #c06c84
color2  #7aa89f
color3  #d4a85c
color4  #5b7fa6
color5  #8b6fa8
color6  #5f9ea0
color7  #2b3440

color8  #aab4bf
color9  #d27b92
color10 #8db8ae
color11 #e0b56b
color12 #6c90b8
color13 #9a80b8
color14 #6fb0b3
color15 #1f2933
