# "Piano + Mic Mix" -- a virtual output device for piano lessons.
#
# Pick "Piano + Mic Mix" as the output device of whatever you are playing from
# (in REAPER: Audio system = ALSA, output device = "piano_mix", see
# ~/.config/alsa/asoundrc), and this sink becomes a mix of everything played into
# it plus the G-Track Pro microphone:
#
#   G-Track Pro mic --loopback--> piano-mix <--(piano, or anything else you send)
#                                     |
#                                     +--> monitor  = the "microphone" a call app captures
#                                     |
#                                     +--loopback--> G-Track Pro headphones
#
# The sink volume is the master level of both the virtual microphone and the
# headphone feed: the monitor is post-fader, so muting or lowering "Piano + Mic Mix"
# in a mixer (pavucontrol/wpctl) affects both.
#
# Nothing is routed automatically: applications only end up in the mix when they are
# explicitly pointed at it, so ordinary playback is unaffected.
#
# The two target.object names below are USB device names (they embed
# vendor/product/serial). Update them if the G-Track Pro is ever replaced; find the
# new names with `pactl list short sinks` / `pactl list short sources`.

context.objects = [
    {   factory = adapter
        args = {
            factory.name     = "support.null-audio-sink"
            node.name        = "piano-mix"
            node.description = "Piano + Mic Mix"
            media.class      = "Audio/Sink"
            object.linger    = true
            audio.position   = [ "FL" "FR" ]
        }
    }
]

context.modules = [
    # --- G-Track Pro microphone -> piano-mix (so callers hear the voice too) ---
    {   name = "libpipewire-module-loopback"
        args = {
            capture.props = {
                node.name        = "piano-mix.mic.in"
                node.description = "G-Track Mic -> Piano Mix"
                target.object    = "alsa_input.usb-Samson_Technologies_Samson_G-Track_Pro_ADC7380227262B00-00.analog-stereo"
                audio.position   = [ "FL" "FR" ]
            }
            playback.props = {
                node.name        = "piano-mix.mic.out"
                node.description = "G-Track Mic -> Piano Mix"
                target.object    = "piano-mix"
                audio.position   = [ "FL" "FR" ]
            }
        }
    }
    # --- piano-mix -> G-Track Pro headphones (so you hear the same mix) ---
    {   name = "libpipewire-module-loopback"
        args = {
            capture.props = {
                node.name           = "piano-mix.hp.in"
                node.description    = "Piano Mix -> G-Track Headphones"
                target.object       = "piano-mix"
                stream.capture.sink = true
                audio.position      = [ "FL" "FR" ]
            }
            playback.props = {
                node.name        = "piano-mix.hp.out"
                node.description = "Piano Mix -> G-Track Headphones"
                target.object    = "alsa_output.usb-Samson_Technologies_Samson_G-Track_Pro_ADC7380227262B00-00.analog-stereo"
                audio.position   = [ "FL" "FR" ]
            }
        }
    }
]
