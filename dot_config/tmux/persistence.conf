# No continuum: autosaving is driven by tmux-resurrect-save.timer.
set -g @resurrect-dir "$HOME/.local/state/tmux/resurrect"
set -g @resurrect-default-processes '__tmux_persist_disabled__'
# Only commands synthesized from verified Pi/nvim pane metadata are allowed.
set -g @resurrect-processes '"tmux-persist->~/.local/bin/tmux-persist *"'
set -g @resurrect-hook-post-save-layout '"$HOME/.local/bin/tmux-persist" filter'
set -g @resurrect-capture-pane-contents 'off'
run-shell '"$HOME/.local/share/tmux/plugins/tmux-resurrect/resurrect.tmux"'
# Serialize manual operations with timer saves and startup restoration.
bind C-s run-shell -b '"$HOME/.local/bin/tmux-persist" save --manual'
bind C-r run-shell -b '"$HOME/.local/bin/tmux-persist" restore'
run-shell -b '"$HOME/.local/bin/tmux-persist" startup'
