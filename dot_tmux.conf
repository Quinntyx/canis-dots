# ================= basics =================
set -g prefix C-a            # C-a twice sends a literal C-a to the shell
unbind C-b
set -g mouse on
set -g base-index 1
set -g mode-keys vi
set -g default-terminal "tmux-256color"
set -g default-shell /usr/bin/fish

# ================= pi: Shift+Enter, Ctrl+Enter, Alt+Enter =================
# Without this, tmux collapses modified Enters to plain \r.
# Requires tmux >= 3.5 (you have 3.7b). Restart tmux fully after changing:
#   tmux kill-server && tmux
set -g extended-keys on
set -g extended-keys-format csi-u

# ================= helix port: Workman movement (y n e o) =================
# NO -r repeat flag: repeat would make tmux swallow y/n/e/o for 500ms
# (repeat-time) after a pane switch — and y/n/e/o are helix's movement
# keys, so typing right after switching would get eaten as pane-switches.
bind y select-pane -L
bind n select-pane -D
bind e select-pane -U
bind o select-pane -R

# uppercase = swap active pane with neighbor in that direction
# (mirrors your helix swap_view_* keys)
bind Y swap-pane -t '{left-of}'
bind N swap-pane -t '{down-of}'
bind E swap-pane -t '{up-of}'
bind O swap-pane -t '{right-of}'

# ctrl = resize the pane toward that direction (helix resize_* keys).
# `-r` is safe here specifically: repeat only swallows the same key while the
# chord is live, and that key is Ctrl+letter — plain y/n/e/o typing is never
# eaten, which is why the bindings above must not carry it.
bind -r C-y resize-pane -L 5
bind -r C-n resize-pane -D 5
bind -r C-e resize-pane -U 5
bind -r C-o resize-pane -R 5

# splits open in the current directory (vim-ish keys)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ================= session control =================
# C-a q: kill this session (all panes/windows in it die).
# Overrides the default q (display-panes). For a safety prompt instead:
#   bind q confirm-before -p "kill session? (y/n)" kill-session
bind q kill-session
