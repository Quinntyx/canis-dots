---
- name: Configure enrolled workstations after their data has been restored
  hosts: workstations
  gather_facts: true
  serial: 1
  # Empty public files are valid; encrypt real values with ansible-vault edit.
  vars_files:
    - "../secrets/{{ inventory_hostname }}.yml"
  pre_tasks:
    - name: Require an explicitly enrolled ordinary account
      ansible.builtin.assert:
        that:
          - inventory_hostname in ['araveia', 'syssec-canis']
          - dots_user != 'root'
          - dots_home is match('^/')
          - dots_home != '/'
          - not dots_sandbox or dots_home != ansible_facts.user_dir
        fail_msg: Use the intended normal account; tests must supply a disposable home.
    - name: Verify the home directory itself is not a link
      ansible.builtin.stat:
        path: "{{ dots_home }}"
        follow: false
      register: dots_home_check
    - name: Require the existing account home
      ansible.builtin.assert:
        that:
          - dots_home_check.stat.isdir | default(false)
          - not dots_home_check.stat.islnk | default(false)
        quiet: true
    - name: Check existing araveia data and network identity before application writes
      ansible.builtin.include_tasks: preflight.yml
      when: inventory_hostname == 'araveia' and not dots_sandbox
  roles:
    - role: common
      tags: [always]
    - role: system
      when: inventory_hostname == 'araveia'
      tags: [system]
    - role: forgejo
      when: inventory_hostname == 'araveia'
      tags: [forgejo]
    - role: shell
      tags: [shell]
    - role: git
      tags: [git]
    - role: ssh
      tags: [ssh]
    - role: tmux
      tags: [tmux]
    - role: editor
      tags: [editor]
    - role: agents
      tags: [agents]
    - role: desktop
      when: inventory_hostname == 'araveia'
      tags: [desktop]
    - role: mail
      when: inventory_hostname == 'araveia'
      tags: [mail]
    - role: cliproxyapi
      when: inventory_hostname == 'araveia'
      tags: [cliproxyapi]
    - role: website
      when: inventory_hostname == 'araveia'
      tags: [website]
    - role: software
      when: inventory_hostname == 'araveia'
      tags: [software]
