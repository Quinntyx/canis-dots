---
- name: Inspect the agent directory's authoritative settings
  ansible.builtin.stat:
    path: "{{ dots_home }}/{{ dots_pi_agent_dir }}/settings.json"
    checksum_algorithm: sha256
  register: dots_profile_settings
- name: Create private package-reconciliation receipts directory
  ansible.builtin.file:
    path: "{{ dots_home }}/.local/state/ansible-dots"
    state: directory
    mode: '0700'
# Receipts record the exact reconciliation command, so receipts written by the
# former bare `pi update` (which only self-updates Pi) never count as success.
- name: Name this directory's reconciliation receipt
  ansible.builtin.set_fact:
    dots_profile_receipt_path: "{{ dots_home }}/.local/state/ansible-dots/pi-extensions-{{ dots_pi_agent_dir | replace('/', '_') }}.sha256"
    dots_profile_receipt_expected: "pi update --extensions {{ dots_profile_settings.stat.checksum | default('') }}"
- name: Inspect the last successful package reconciliation receipt
  ansible.builtin.stat:
    path: "{{ dots_profile_receipt_path }}"
  register: dots_profile_receipt
- name: Read the last successful receipt
  ansible.builtin.slurp:
    src: "{{ dots_profile_receipt_path }}"
  register: dots_profile_previous
  when: dots_profile_receipt.stat.exists
- name: Reconcile only when declared settings changed or never succeeded
  when:
    - not ansible_check_mode
    - dots_profile_settings.stat.exists
    - not dots_profile_receipt.stat.exists or (dots_profile_previous.content | default('') | b64decode | trim) != dots_profile_receipt_expected
  block:
    # Packages only: never `pi update` (self-update) or --all; Pi stays at the
    # pinned npm version owned by tools.yml.
    - name: Let Pi acquire the directory's declared Git/npm package resources
      ansible.builtin.command:
        argv: "{{ dots_agent_untrusted_argv + [dots_home + '/.npm-global/bin/pi', 'update', '--extensions'] }}"
      environment: >-
        {{ {'HOME': dots_home,
            'PATH': dots_home + '/.npm-global/bin:' + dots_home + '/.local/bin:/usr/local/bin:' + dots_agent_bindir + ':/usr/bin:/bin',
            'NPM_CONFIG_PREFIX': dots_home + '/.npm-global',
            'PI_CODING_AGENT_DIR': dots_home + '/' + dots_pi_agent_dir,
            'PPI_PI_ROOT': dots_home + '/.config/pi',
            'PPI_PI_DIR': dots_home + '/' + dots_pi_agent_dir}
           | combine(dots_git_environment | default({})) }}
      changed_when: true
      no_log: true
      diff: false
    - name: Record successful settings reconciliation, never provider identities
      ansible.builtin.copy:
        content: "{{ dots_profile_receipt_expected }}\n"
        dest: "{{ dots_profile_receipt_path }}"
        mode: '0600'
