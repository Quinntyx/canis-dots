# Tailnet-only inference has no API key. The private management key is injected
# into an untracked runtime copy by cliproxyapi.
config-version: 8
server:
  host: "100.110.255.43"
  port: 8317
  discovery:
    enabled: false
oauth:
  auth-dir: "~/.local/share/cliproxyapi/auths"
routing:
  strategy: "reset-pressure"
  session-affinity: true
  session-affinity-ttl: "168h"
  session-affinity-subagents: false
  burn-deadline:
    enabled: true
    threshold: 0.75
    poll-interval: "1m"
    max-observation-age: "2m"
    state-file: "~/.local/state/cliproxyapi/burn.json"
observability:
  usage:
    usage-statistics-enabled: true
