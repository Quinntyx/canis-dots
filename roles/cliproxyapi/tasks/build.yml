---
- name: Create source parent without adopting unrelated checkouts
  ansible.builtin.file:
    path: "{{ dots_home }}/docs/src/CLIProxyAPI"
    state: directory
    mode: '0755'
- name: Converge the canonical clean checkout without force-resetting user work
  ansible.builtin.git:
    repo: "{{ dots_cliproxyapi_repo }}"
    dest: "{{ dots_home }}/docs/src/CLIProxyAPI/main"
    version: "{{ dots_cliproxyapi_revision }}"
    force: false
  environment: "{{ dots_git_environment }}"
  register: dots_proxy_checkout
- name: Check the managed proxy binary
  ansible.builtin.stat:
    path: "{{ dots_home }}/.local/lib/cliproxyapi/cli-proxy-api"
  register: dots_proxy_binary
- name: Create private binary destination
  ansible.builtin.file:
    path: "{{ dots_home }}/.local/lib/cliproxyapi"
    state: directory
    mode: '0700'
- name: Inspect the last successful build receipt
  ansible.builtin.stat:
    path: "{{ dots_home }}/.local/lib/cliproxyapi/build-revision"
  register: dots_proxy_receipt
- name: Read the last successful build receipt
  ansible.builtin.slurp:
    src: "{{ dots_home }}/.local/lib/cliproxyapi/build-revision"
  register: dots_proxy_previous
  when: dots_proxy_receipt.stat.exists
- name: Build the selected proxy revision, retrying any previously failed build
  ansible.builtin.command:
    argv: ["{{ dots_go_binary | default('go') }}", build, -trimpath, -o, "{{ dots_home }}/.local/lib/cliproxyapi/cli-proxy-api", ./cmd/server]
    chdir: "{{ dots_home }}/docs/src/CLIProxyAPI/main"
  register: dots_proxy_built
  changed_when: true
  when: not ansible_check_mode and (not dots_proxy_binary.stat.exists or (dots_proxy_previous.content | default('') | b64decode | trim) != dots_proxy_checkout.after)
- name: Record the revision only after a successful build
  ansible.builtin.copy:
    content: "{{ dots_proxy_checkout.after }}\n"
    dest: "{{ dots_home }}/.local/lib/cliproxyapi/build-revision"
    mode: '0600'
  when: dots_proxy_built.changed
- name: Restrict proxy binary permissions
  ansible.builtin.file:
    path: "{{ dots_home }}/.local/lib/cliproxyapi/cli-proxy-api"
    mode: '0700'
  when: not ansible_check_mode or dots_proxy_binary.stat.exists
