---
# vault_files is optional and uses Ansible's built-in copy/Vault integration.
- name: Require a home-relative secret destination
  ansible.builtin.assert:
    that:
      - not vault_file.dest.startswith('/')
      - "'..' not in vault_file.dest.split('/')"
  no_log: true
- name: Check private file parents without following links
  ansible.builtin.include_tasks: parents.yml
  vars:
    config_dest: "{{ vault_file.dest }}"
  no_log: true
- name: Inspect the private destination without following links
  ansible.builtin.stat:
    path: "{{ dots_home }}/{{ vault_file.dest }}"
    follow: false
    get_checksum: false
  register: dots_vault_destination
  no_log: true
- name: Refuse to replace a private destination link or non-regular file
  ansible.builtin.assert:
    that: not dots_vault_destination.stat.exists or (dots_vault_destination.stat.isreg | default(false) and not dots_vault_destination.stat.islnk | default(false))
  no_log: true
- name: Install the encrypted file privately
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../secrets/{{ vault_file.src }}"
    dest: "{{ dots_home }}/{{ vault_file.dest }}"
    mode: '0600'
    decrypt: true
    follow: false
  no_log: true
  diff: false
  register: dots_vault_copy
- name: Remember changed credentials for affected service handlers
  ansible.builtin.set_fact:
    dots_changed_secret_roles: "{{ (dots_changed_secret_roles | default([])) | union(vault_file.services | default([])) if dots_vault_copy.changed else dots_changed_secret_roles | default([]) }}"
