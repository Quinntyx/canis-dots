# "Piano + Mic Mix" -- a virtual output device for piano lessons.
#
# Two sinks are defined here:
#
#   piano-out   "Piano Output (REAPER)"  <- what you play into (REAPER etc.)
#   piano-mix   "Piano + Mic Mix"        <- the mix; its monitor is the virtual microphone
#
# Pick "Piano + Mic Mix" as the output device of whatever you are playing from
# (in REAPER: Audio system = ALSA, output device = "piano_mix", see
# ~/.config/alsa/asoundrc) and the signal is split like this:
#
#   G-Track Pro mic --loopback--> piano-mix <--loopback-- piano-out <--(piano)
#                                     |                       |
#                                     |                       +--loopback--> G-Track Pro headphones
#                                     +--> monitor = the "microphone" a call app captures
#
# i.e. the headphones get the piano (plus whatever the call app itself sends to the
# G-Track Pro) but *never* the microphone, so you do not hear your own voice while
# you play. The call app still captures "Monitor of Piano + Mic Mix", which is the
# microphone plus the piano.
#
# To get your own voice back in the headphones (self-monitoring), change the capture
# side of the "Piano Output -> G-Track Headphones" loopback below from "piano-out" to
# "piano-mix" (keep stream.capture.sink = true).
#
# Levels: the "Piano + Mic Mix" fader is the master of the virtual microphone (its
# monitor is post-fader). The headphone feed follows piano-out, so use the "Piano
# Output (REAPER)" fader (or REAPER's own master) to adjust what you hear.
#
# Nothing is routed automatically: applications only end up in these sinks when they
# are explicitly pointed at them, so ordinary playback is unaffected.
#
# The two target.object names below are USB device names (they embed
# vendor/product/serial). Update them if the G-Track Pro is ever replaced; find the
# new names with `pactl list short sinks` / `pactl list short sources`.

context.objects = [
    # --- the mix: everything you play plus the microphone; its monitor is the virtual mic ---
    {   factory = adapter
        args = {
            factory.name     = "support.null-audio-sink"
            node.name        = "piano-mix"
            node.description = "Piano + Mic Mix"
            media.class      = "Audio/Sink"
            object.linger    = true
            audio.position   = [ "FL" "FR" ]
        }
    }
    # --- what you play into (REAPER's output device); fans out to the mix and the headphones ---
    {   factory = adapter
        args = {
            factory.name     = "support.null-audio-sink"
            node.name        = "piano-out"
            node.description = "Piano Output (REAPER)"
            media.class      = "Audio/Sink"
            object.linger    = true
            audio.position   = [ "FL" "FR" ]
        }
    }
]

context.modules = [
    # --- G-Track Pro microphone -> piano-mix (so callers hear the voice too) ---
    {   name = "libpipewire-module-loopback"
        args = {
            capture.props = {
                node.name        = "piano-mix.mic.in"
                node.description = "G-Track Mic -> Piano Mix"
                target.object    = "alsa_input.usb-Samson_Technologies_Samson_G-Track_Pro_ADC7380227262B00-00.analog-stereo"
                audio.position   = [ "FL" "FR" ]
            }
            playback.props = {
                node.name        = "piano-mix.mic.out"
                node.description = "G-Track Mic -> Piano Mix"
                target.object    = "piano-mix"
                audio.position   = [ "FL" "FR" ]
            }
        }
    }
    # --- piano-out -> piano-mix (so callers hear the piano too) ---
    {   name = "libpipewire-module-loopback"
        args = {
            capture.props = {
                node.name           = "piano-mix.piano.in"
                node.description    = "Piano Output -> Piano Mix"
                target.object       = "piano-out"
                stream.capture.sink = true
                audio.position      = [ "FL" "FR" ]
            }
            playback.props = {
                node.name        = "piano-mix.piano.out"
                node.description = "Piano Output -> Piano Mix"
                target.object    = "piano-mix"
                audio.position   = [ "FL" "FR" ]
            }
        }
    }
    # --- piano-out -> G-Track Pro headphones (piano only: no microphone, no self-monitoring) ---
    {   name = "libpipewire-module-loopback"
        args = {
            capture.props = {
                node.name           = "piano-out.hp.in"
                node.description    = "Piano Output -> G-Track Headphones"
                target.object       = "piano-out"
                stream.capture.sink = true
                audio.position      = [ "FL" "FR" ]
            }
            playback.props = {
                node.name        = "piano-out.hp.out"
                node.description = "Piano Output -> G-Track Headphones"
                target.object    = "alsa_output.usb-Samson_Technologies_Samson_G-Track_Pro_ADC7380227262B00-00.analog-stereo"
                audio.position   = [ "FL" "FR" ]
            }
        }
    }
]
