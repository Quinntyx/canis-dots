---
- name: Install desktop common files with mode 0644
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/copy-tree.yml"
  vars:
    config_source: "{{ role_path }}/files/common/0644"
    config_mode: '0644'
- name: Install desktop common files with mode 0755
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/copy-tree.yml"
  vars:
    config_source: "{{ role_path }}/files/common/0755"
    config_mode: '0755'
# These main-only files are not inputs to sunsetr/meal-water. The normal
# user-service step still daemon-reloads systemd without activating new timers.
- name: Install main-only desktop files without restarting unrelated services
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/copy-tree.yml"
  vars:
    config_source: "{{ role_path }}/files/araveia/0644"
    config_mode: '0644'
    config_track_restart_inputs: false
  when: inventory_hostname == 'araveia'
- name: Render .local/share/applications/decentsampler.desktop
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/template.yml"
  vars:
    config_template: ".local/share/applications/decentsampler.desktop.j2"
    config_dest: ".local/share/applications/decentsampler.desktop"
    config_mode: '0644'
- name: Link .config/systemd/user/default.target.wants/syncthing.service
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/link.yml"
  vars:
    config_dest: ".config/systemd/user/default.target.wants/syncthing.service"
    config_target: "/usr/lib/systemd/user/syncthing.service"
- name: Link .config/systemd/user/timers.target.wants/sunsetr-resume.timer
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/link.yml"
  vars:
    config_dest: ".config/systemd/user/timers.target.wants/sunsetr-resume.timer"
    config_target: "../sunsetr-resume.timer"
