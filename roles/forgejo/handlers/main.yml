---
- name: Restart forgejo services
  ansible.builtin.command:
    argv: [docker, compose, up, -d, --force-recreate, forgejo]
    chdir: "{{ dots_home }}/docs/host/forgejo"
  changed_when: true
  when: dots_manage_services and not dots_sandbox and not ansible_check_mode
  notify: Reload forgejo user unit
- name: Reload forgejo user unit
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    scope: user
    daemon_reload: true
    state: started
  loop: ["forgejo.service"]
  environment:
    XDG_RUNTIME_DIR: "/run/user/{{ dots_uid }}"
  when: dots_manage_services and not dots_sandbox
