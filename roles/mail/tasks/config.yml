- name: Link .config/systemd/user/default.target.wants/goimapnotify.service
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/link.yml"
  vars:
    config_dest: ".config/systemd/user/default.target.wants/goimapnotify.service"
    config_target: "../goimapnotify.service"
- name: Link .config/systemd/user/timers.target.wants/mail-sync.timer
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/link.yml"
  vars:
    config_dest: ".config/systemd/user/timers.target.wants/mail-sync.timer"
    config_target: "../mail-sync.timer"
