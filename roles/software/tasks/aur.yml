---
# Shared, pinned application prerequisites for desktop/mail before bulk software.
- name: Query whether this declared package is already installed
  ansible.builtin.command:
    argv: [/usr/bin/pacman, -Q, "{{ dots_aur_name }}"]
  register: dots_aur_installed
  changed_when: false
  failed_when: dots_aur_installed.rc not in [0, 1]
  check_mode: false
- name: Build the missing pinned prerequisite using native tasks
  when: dots_aur_installed.rc != 0 and not ansible_check_mode
  vars:
    software_builder_user: dots-builder
    software_builder_home: /var/lib/dots-builder
    software_bindir: /usr/bin
    software_recipe:
      name: "{{ dots_aur_name }}"
      repo: "https://aur.archlinux.org/{{ dots_aur_name }}.git"
      version: "{{ dots_aur_revisions[dots_aur_name] }}"
      subdir: .
  block:
    - name: Require a reviewed prerequisite revision
      ansible.builtin.assert:
        that: dots_aur_name in dots_aur_revisions
    - name: Prepare the isolated build account
      ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/software/tasks/builder.yml"
    - name: Build and install the declared prerequisite
      ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/software/tasks/build-package.yml"
