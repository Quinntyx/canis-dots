---
# No sudoers entry, root bridge, or root execution of PKGBUILD code.
- name: Prepare the isolated build account
  ansible.builtin.include_tasks: builder.yml
- name: Initialize the builder's Rust toolchain separately from the login account
  become: true
  become_user: dots-builder
  environment:
    HOME: /var/lib/dots-builder
    PATH: /usr/bin:/bin
  ansible.builtin.command:
    argv: [/usr/bin/rustup, default, stable]
    creates: /var/lib/dots-builder/.rustup/settings.toml
- name: Build missing curated AUR packages in declared order
  ansible.builtin.include_tasks: build-package.yml
  loop: "{{ software_aur_packages }}"
  loop_control:
    loop_var: software_aur_name
  vars:
    software_recipe:
      name: "{{ software_aur_name }}"
      repo: "https://aur.archlinux.org/{{ software_aur_name }}.git"
      version: HEAD
      subdir: .
  when: software_aur_name not in software_installed.stdout_lines
- name: Read the declared local package owners and exact refs
  ansible.builtin.include_vars: "{{ role_path }}/vars/local-sources.yml"
- name: Build missing owned packages from their source repository, not a personal checkout
  ansible.builtin.include_tasks: build-package.yml
  loop: "{{ software_local_sources }}"
  loop_control:
    loop_var: software_local_spec
  vars:
    software_recipe:
      name: "{{ software_local_spec.packages[0] }}"
      repo: "{{ software_local_spec.repo }}"
      version: "{{ software_local_spec.version }}"
      subdir: "{{ software_local_spec.subdir }}"
  when: software_local_spec.packages | difference(software_installed.stdout_lines) | length > 0
