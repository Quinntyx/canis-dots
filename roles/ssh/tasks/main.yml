---
- name: Track ssh configuration changes separately
  ansible.builtin.set_fact:
    dots_configuration_changed: false
- name: Install ssh configuration
  ansible.builtin.include_tasks: config.yml
- name: Inspect the restored SSH configuration without following it
  ansible.builtin.stat:
    path: "{{ dots_home }}/.ssh/config"
    follow: false
    get_checksum: false
  register: ssh_existing_config
- name: Refuse an unexpected SSH configuration symlink or directory
  ansible.builtin.assert:
    that: not ssh_existing_config.stat.exists or (ssh_existing_config.stat.isreg | default(false) and not ssh_existing_config.stat.islnk | default(false))
    fail_msg: Inspect the restored SSH configuration before deployment.
- name: Include this node's SSH fragment without replacing personal SSH configuration
  ansible.builtin.blockinfile:
    path: "{{ dots_home }}/.ssh/config"
    create: true
    mode: '0600'
    insertbefore: BOF
    marker: '# {mark} ANSIBLE-DOTS {{ "MAIN" if inventory_hostname == "araveia" else "LAB" }} INCLUDE'
    block: 'Include "{{ dots_home }}/.ssh/config.d/{{ "50-main.conf" if inventory_hostname == "araveia" else "50-lab.conf" }}"'
    backup: false
