---
# The firewalld CLI owns its configuration; do not replay a historical XML dump.
- name: Start the distro firewall without deleting or replacing existing zones
  ansible.builtin.systemd_service:
    name: firewalld.service
    enabled: true
    state: started
- name: Inspect permanent firewall zones
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --get-zones]
  register: dots_firewall_zones
  changed_when: false
  check_mode: false
- name: Inspect runtime firewall zones separately from permanent configuration
  ansible.builtin.command:
    argv: [firewall-cmd, --get-zones]
  register: dots_firewall_runtime_zones
  changed_when: false
  check_mode: false
- name: Allow creation of a new runtime zone only during explicit fresh recovery
  ansible.builtin.assert:
    that: "'tailscale' in dots_firewall_runtime_zones.stdout.split() or dots_fresh_install | default(false) | bool"
    fail_msg: Existing-node firewall lacks its declared tailscale zone. Inspect its runtime-only rules before a deliberate reload; fresh recovery authorizes first-install zone activation.
- name: Allocate only the declared tailnet zone when absent
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --new-zone=tailscale]
  when: not ansible_check_mode and 'tailscale' not in dots_firewall_zones.stdout.split()
  changed_when: true
- name: Preserve permanent SSH access before first-install firewall activation
  ansible.builtin.command:
    argv: [firewall-cmd, --permanent, --zone=public, --add-service=ssh]
  when: not ansible_check_mode and 'tailscale' not in dots_firewall_runtime_zones.stdout.split()
  changed_when: true
- name: Validate firewalld configuration before activating the newly created zone
  ansible.builtin.command:
    argv: [firewall-cmd, --check-config]
  when: not ansible_check_mode and 'tailscale' not in dots_firewall_runtime_zones.stdout.split()
  changed_when: false
- name: Activate the new zone once during explicit fresh recovery
  ansible.builtin.command:
    argv: [firewall-cmd, --reload]
  when: not ansible_check_mode and 'tailscale' not in dots_firewall_runtime_zones.stdout.split()
  changed_when: true
- name: Inspect the current runtime zone for the tailnet interface
  ansible.builtin.command:
    argv: [firewall-cmd, --get-zone-of-interface=tailscale0]
  register: dots_tailnet_zone
  changed_when: false
  failed_when: dots_tailnet_zone.rc not in [0, 1, 2] or (dots_tailnet_zone.rc == 2 and dots_tailnet_zone.stdout | trim != 'no zone')
  check_mode: false
- name: Refuse to silently steal the interface from an unrelated custom zone
  ansible.builtin.assert:
    that: dots_tailnet_zone.stdout | trim in ['tailscale', 'public', 'no zone', '']
    fail_msg: tailscale0 belongs to an unexpected custom zone; inspect the existing firewall before continuing.
- name: Maintain scoped permanent and runtime rules without a firewall-wide reload
  ansible.builtin.include_tasks: firewall-rule.yml
  loop:
    - {zone: public, kind: service, value: ssh}
    - {zone: tailscale, kind: service, value: ssh}
    - {zone: tailscale, kind: port, value: '60000-61000/udp'}
    - {zone: tailscale, kind: port, value: '8317/tcp'}
    - {zone: tailscale, kind: interface, value: tailscale0}
  loop_control:
    loop_var: dots_firewall_rule
  when: not ansible_check_mode
- name: Require the proxy port and tailnet interface to be explicitly reachable
  ansible.builtin.command:
    argv: "{{ ['firewall-cmd', '--zone=tailscale', '--query-' ~ item.kind ~ '=' ~ item.value] }}"
  loop:
    - {kind: port, value: '8317/tcp'}
    - {kind: interface, value: tailscale0}
  changed_when: false
  when: not ansible_check_mode
