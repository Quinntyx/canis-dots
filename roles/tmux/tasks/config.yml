---
- name: Install tmux common files with mode 0644
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/copy-tree.yml"
  vars:
    config_source: "{{ role_path }}/files/common/0644"
    config_mode: '0644'
- name: Install tmux common files with mode 0700
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/copy-tree.yml"
  vars:
    config_source: "{{ role_path }}/files/common/0700"
    config_mode: '0700'
- name: Link .config/systemd/user/timers.target.wants/tmux-resurrect-save.timer
  ansible.builtin.include_tasks: "{{ dots_controller_root }}/roles/common/tasks/link.yml"
  vars:
    config_dest: ".config/systemd/user/timers.target.wants/tmux-resurrect-save.timer"
    config_target: "../tmux-resurrect-save.timer"
